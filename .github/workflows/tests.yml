name: VoxelEngine Tests

on:
  push:
    branches: [ master, test, "feature/**" ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          libglew-dev \
          libglfw3-dev \
          libglm-dev \
          zlib1g-dev \
          libgl-dev

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DVOXEL_ENGINE_BUILD_TESTS=ON \
          -DVOXEL_ENGINE_BUILD_EXAMPLES=OFF

    - name: Build tests
      run: cmake --build build --target voxel_tests -j$(nproc)

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure --test-dir .
